<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Supra Tbilisi - authentic Georgian restaurant">
  <title>Gallery</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <header id="top-header">
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">Supra <span class="brand-accent">Tbilisi</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="menu.html">Menu</a></li>
          <li class="nav-item"><a class="nav-link active" href="gallery.html">Gallery</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="page-banner text-center text-white">
      <h1>Gallery</h1>
      <p class="mb-0">A taste of the atmosphere</p>
    </section>

    <section class="container py-5">
      <div id="gallery-grid">
        <figure class="gallery-item">
          <img src="images/kudbarimid.webp" alt="Kudbari">
          <figcaption>Kudbari</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/feastmid.jpg" alt="thefeast">
          <figcaption>The Supra</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/mtsvadimid.png" alt="Mtsvadi">
          <figcaption>Mtsvadi</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/qvevrimid.jpg" alt="Qvevri Wine">
          <figcaption>Qvevri Wine</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/dininghall2mid.jpg" alt="Our Dining Hall">
          <figcaption>Our Dining Hall</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="images/tblisimid.jpg" alt="Tbilisi">
          <figcaption>Tbilisi</figcaption>
        </figure>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="text-center py-4">
    <div class="container">
      <p class="mb-1">&copy; 2026 Supra Tbilisi &middot; 12 Rustaveli Avenue, Tbilisi</p>
      <p class="mb-0"><span class="brand-accent">Gaumarjos!</span> Open daily 12:00 &ndash; 23:00</p>
    </div>
  </footer>

  <a href="contact.html" class="book-fab btn btn-gold">Book a Table</a>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
